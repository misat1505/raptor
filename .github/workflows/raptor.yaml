name: Raptor CI

on:
  pull_request:
    branches:
      - master

jobs:
  test-and-build:
    runs-on: ubuntu-24.04

    env:
      LLVM_SYS_180_PREFIX: /usr/lib/llvm-18

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LLVM 18 + Clang + Polly
        run: |
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 18
          sudo apt-get install -y \
            libpolly-18-dev \
            libzstd-dev \
            llvm-18-dev \
            clang-18 \
            lld-18 \
            valgrind

      - name: Verify LLVM tools on PATH
        run: |
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Build self-hosted compiler
        run: |
          chmod +x ./bootstrap/bootstrap.sh
          ./scripts/bootstrap-compiler.sh

      - name: Run tests
        run: |
          chmod +x ./scripts/run-tests.sh
          ./scripts/run-tests.sh

      - name: Check compiler stability
        run: |
          chmod +x ./scripts/compiler-stability-check.sh
          ./scripts/compiler-stability-check.sh
