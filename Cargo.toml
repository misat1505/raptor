[package]
name = "raptor"
version = "0.1.0"
edition = "2021"

[lib]
name = "raptor_lib"
path = "src/lib.rs"

[[bin]]
name = "raptor"
path = "src/main.rs"

[[bin]]
name = "lsp"
path = "src/bin/lsp.rs"

[dependencies]
phf = { version = "0.11.1", features = ["macros"] }
inkwell = { version = "0.9", features = ["llvm18-1"] }
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde_json = "1"

[dev-dependencies]
gag = "1.0"