[package]
name = "raptor-lsp"
version = "0.1.0"
edition = "2021"
description = "Language Server for Raptor — drives the self-hosted lsp-backend over JSON"
license = "MIT"

[[bin]]
name = "raptor-lsp"
path = "src/main.rs"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
